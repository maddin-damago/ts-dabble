<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="../styles/rps.css">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <main>
        <div id="points">0 : 0</div>
        <section id="arena">
            <img class="heros" id="gurko" src="../assets/SonGoku2.png" alt="asd">
            <div id="skills">
                <img class="skill" id="scissors" src="../assets/scissors.png" alt="sad">
                <img class="skill" id="stone" src="../assets/stone.png" alt="sad">
                <img class="skill" id="paper" src="../assets/paper.png" alt="sad">
            </div>
            <img class="heros" id="veggi" src="../assets/Vegeta2.png" alt="asd">
        </section>
        <section id="fight-section">
            <button type="button" id="fight" disabled>FIGHT</button>
        </section>
        <section id="choices">

        </section>

    <script type="module" src="../../dist/scripts/scriptRPS.js"></script>
